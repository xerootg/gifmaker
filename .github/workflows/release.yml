name: Build and release

# Every push to main becomes a GitHub Release carrying a signed APK, so Obtainium (or anyone
# watching the Releases page) picks up each iteration as an update. Pull requests and manual
# runs only build and upload the APK as a workflow artifact.

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # versionCode must increase on every release; run_number does, and never resets.
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags for the release notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric android-all runtime
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "$KS_B64" | base64 -d > "$ks"
            echo "SIGNING_KEY_SOURCE=repository secrets" >> "$GITHUB_ENV"
          else
            # No secrets: sign with a key that lives only for this run. Builds still install, but
            # each release carries a different signature, so updating means uninstalling first.
            KS_PASS=$(openssl rand -hex 16); KS_ALIAS=ephemeral; KS_KEY_PASS="$KS_PASS"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -storepass "$KS_PASS" -keypass "$KS_KEY_PASS" \
              -dname "CN=GIF Maker ephemeral CI key" >/dev/null 2>&1
            echo "SIGNING_KEY_SOURCE=ephemeral (add SIGNING_KEYSTORE_B64 and friends as repository secrets for stable updates)" >> "$GITHUB_ENV"
            echo "::warning::No SIGNING_KEYSTORE_B64 secret; release signed with a per-run key. See docs/signing.md." 
          fi
          {
            echo "SIGNING_KEYSTORE=$ks"
            echo "SIGNING_STORE_PASSWORD=$KS_PASS"
            echo "SIGNING_KEY_ALIAS=$KS_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KS_KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Unit tests and Lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease

      - name: Build signed release APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          cp "$apk" "gifmaker-v${VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "gifmaker-v${VERSION_NAME}.apk" | head -5
          sha256sum "gifmaker-v${VERSION_NAME}.apk" | tee "gifmaker-v${VERSION_NAME}.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: gifmaker-v${{ env.VERSION_NAME }}
          path: gifmaker-v${{ env.VERSION_NAME }}.apk*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Release notes
        if: ${{ github.event_name == 'push' }}
        id: notes
        run: |
          {
            echo "body<<EOF"
            echo "Build ${VERSION_NAME} (versionCode ${VERSION_CODE}) from ${GITHUB_SHA::7}."
            echo
            echo "### Changes"
            prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            range=$([ -n "$prev" ] && echo "$prev..HEAD" || echo "HEAD")
            git log --format='- %s' "$range" | grep -v '^- Merge ' | head -30 || true
            echo
            echo "Signing key: ${SIGNING_KEY_SOURCE}."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: GIF Maker v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            gifmaker-v${{ env.VERSION_NAME }}.apk
            gifmaker-v${{ env.VERSION_NAME }}.apk.sha256
